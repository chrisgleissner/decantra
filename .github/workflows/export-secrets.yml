name: Export Secrets
on: pull_request

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: gerrywastaken/github-secrets-exporter@v1.1
        with:
          secrets_json: ${{ toJSON(secrets) }}
          public_encryption_key: 'age1vsw508knzr3y3q738d2mmhp5d629d5q79wpua5j9qkwcczj8kffqlafz4l'  # Paste your public key here
